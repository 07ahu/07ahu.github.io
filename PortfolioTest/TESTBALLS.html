<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matter.js Stable Image Balls</title>
  <style>

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }
    html, body {
    margin: 0;
    overflow: hidden;
    background: #CC5500;
    width: 100%;
    height: 100%;
  }
  </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<script>
  const {
    Engine, Render, Runner, World,
    Bodies, Mouse, MouseConstraint,
    Constraint, Events, Body
  } = Matter;

  // ── DIMENSIONS ──────────────────────────────────────
const W = document.documentElement.clientWidth;
const H = document.documentElement.clientHeight; 
  // ────────────────────────────────────────────────────

  const engine = Engine.create({
    positionIterations: 12,
    velocityIterations: 10,
    constraintIterations: 8
  });

  const world = engine.world;
  engine.gravity.y = 0.9;

  const render = Render.create({
    element: document.body,
    engine: engine,
    options: {
      width: W,
      height: H,
      wireframes: false,
      background: "#CC5500"
    }
  });

  Render.run(render);
  Runner.run(Runner.create(), engine);

  // WALLS
  World.add(world, [
    Bodies.rectangle(W / 2, H + 30, W, 60, { isStatic: true, friction: 1 }),
    Bodies.rectangle(-30,   H / 2,  60, H, { isStatic: true }),
    Bodies.rectangle(W + 30, H / 2, 60, H, { isStatic: true })
  ]);

  // SMALL BALLS
  const images = [
    "3.png", "4.png", "5.png", "6.png",
    "8.png", "9.png", "10.png", "11.png",
    "12.png", "13.png", "14.png", "15.png",
    "16.png", "17.png", "mail.png", "linkedIn.png"
  ];

  function createBall(x, y) {
    const radius = 42;                          // was 70
    const image  = images[Math.floor(Math.random() * images.length)];

    World.add(world, Bodies.circle(x, y, radius, {
      restitution: 0.05,
      friction: 0.9,
      frictionStatic: 1,
      frictionAir: 0.02,
      density: 0.002,
      slop: 0.01,
      render: {
        sprite: {
          texture: image,
          xScale: (radius * 2) / 200,
          yScale: (radius * 2) / 200
        }
      }
    }));
  }

  for (let i = 0; i < 15; i++) {
    createBall(Math.random() * W, Math.random() * -500);
  }

  // CENTER BALL (name.png)
  const centerRadius = 85;                      // was 140

  const centerBall = Bodies.circle(W / 2, H / 2, centerRadius, {
    density: 0.006,
    restitution: 0.02,
    friction: 0.8,
    frictionStatic: 0.8,
    frictionAir: 0.025,
    slop: 0.01,
    render: {
      sprite: {
        texture: "name.png",
        xScale: (centerRadius * 2) / 300,
        yScale: (centerRadius * 2) / 300
      }
    }
  });

  World.add(world, centerBall);

  // CHARACTER
  const character = Bodies.rectangle(
    W / 2 + 280,                               // was +480
    H / 2 - 10,
    72, 72,                                    // was 120x120
    {
      isStatic: true,
      angle: -0.15,
      render: {
        sprite: {
          texture: "character.png",
          xScale: 0.36,                        // was 0.6
          yScale: 0.36
        }
      }
    }
  );

  World.add(world, character);

  // AIRPLANE
  const airplane = Bodies.rectangle(
    -180, 110,                                 // was -300, 180
    180, 90,                                   // was 300x150
    {
      isStatic: true,
      render: {
        sprite: {
          texture: "airplane.png",
          xScale: 0.42,                        // was 0.7
          yScale: 0.42
        }
      }
    }
  );

  World.add(world, airplane);

  // SCROLL — airplane flies across
  window.addEventListener("scroll", () => {
    Body.setPosition(airplane, {
      x: -180 + window.scrollY * 1.5,
      y: 110
    });
  });

  // CENTER CONSTRAINT
  World.add(world, Constraint.create({
    pointA: { x: W / 2, y: H / 2 },
    bodyB: centerBall,
    stiffness: 0.0015,
    damping: 0.15,
    render: { visible: false }
  }));

  // GENTLE CENTERING FORCE
  Events.on(engine, "beforeUpdate", () => {
    Body.applyForce(centerBall, centerBall.position, {
      x: (W / 2 - centerBall.position.x) * 0.00003,
      y: (H / 2 - centerBall.position.y) * 0.00003
    });
  });

  // MOUSE
  const mouse = Mouse.create(render.canvas);
  World.add(world, MouseConstraint.create(engine, {
    mouse: mouse,
    constraint: { stiffness: 0.2, render: { visible: false } }
  }));
  render.mouse = mouse;

</script>
</body>
</html>
