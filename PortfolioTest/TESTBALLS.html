<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!--

  <title>Matter.js Stable Image Balls</title>

  <style>
    body {
      margin: 0;
      overflow-x: hidden;
      background: #CC5500;

      /* allows scrolling */
      height: 300vh;
    }

    canvas {
      display: block;

      /* keeps scene fixed while scrolling */
      position: fixed;
      top: 0;
      left: 0;
    }

    /*
        .bottom-text {
      position: fixed;
      bottom: 60px;
      width: 100%;

      text-align: center;

      color: #FFF;
      font-family: "Kosugi Maru";
      font-size: 53.063px;
      font-style: normal;
      font-weight: 400;
      line-height: normal;
      letter-spacing: 4px;


      z-index: 1000;

      pointer-events: none;
    }
    */
  </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<script>
  const {
    Engine,
    Render,
    Runner,
    World,
    Bodies,
    Mouse,
    MouseConstraint,
    Constraint,
    Events,
    Body
  } = Matter;

  // ENGINE
  const engine = Engine.create({
    positionIterations: 12,
    velocityIterations: 10,
    constraintIterations: 8
  });

  const world = engine.world;

  engine.gravity.y = 0.9;

  // RENDERER
  const render = Render.create({
    element: document.body,
    engine: engine,

    options: {
      width: window.innerWidth,
      height: window.innerHeight,
      wireframes: false,
      background: "#CC5500"
    }
  });

  Render.run(render);

  // RUNNER
  const runner = Runner.create();
  Runner.run(runner, engine);

  // WALLS
  const ground = Bodies.rectangle(
    window.innerWidth / 2,
    window.innerHeight + 30,
    window.innerWidth,
    60,
    {
      isStatic: true,
      friction: 1
    }
  );

  const leftWall = Bodies.rectangle(
    -30,
    window.innerHeight / 2,
    60,
    window.innerHeight,
    {
      isStatic: true
    }
  );

  const rightWall = Bodies.rectangle(
    window.innerWidth + 30,
    window.innerHeight / 2,
    60,
    window.innerHeight,
    {
      isStatic: true
    }
  );

  World.add(world, [ground, leftWall, rightWall]);

  // SMALL IMAGE BALLS
  const images = [
    "3.png",
    "4.png",
    "5.png",
    "6.png",
    "8.png",
    "9.png",
    "10.png",
    "11.png",
    "12.png",
    "13.png",
    "14.png",
    "15.png",
    "16.png",
    "17.png",
    "mail.png",
    "linkedIn.png",
  ];

  // CREATE SMALL BALLS
  function createBall(x, y) {

    const radius = 70;

    const image = images[Math.floor(Math.random() * images.length)];

    const ball = Bodies.circle(x, y, radius, {

      restitution: 0.05,
      friction: 0.9,
      frictionStatic: 1,
      frictionAir: 0.02,

      density: 0.002,
      slop: 0.01,

      render: {
        sprite: {
          texture: image,
          xScale: (radius * 2) / 200,
          yScale: (radius * 2) / 200
        }
      }
    });

    World.add(world, ball);
  }

  // CREATE BALLS
  for (let i = 0; i < 15; i++) {

    createBall(
      Math.random() * window.innerWidth,
      Math.random() * -800
    );
  }

  // =========================
  // BIG CENTER IMAGE
  // =========================

  const centerRadius = 140;

  const centerBall = Bodies.circle(
    window.innerWidth / 2,
    window.innerHeight / 2,
    centerRadius,
    {

      density: 0.006,

      restitution: 0.02,

      friction: 0.8,
      frictionStatic: 0.8,
      frictionAir: 0.025,

      slop: 0.01,

      render: {
        sprite: {
          texture: "name.png",
          xScale: (centerRadius * 2) / 300,
          yScale: (centerRadius * 2) / 300
        }
      }
    }
  );

  World.add(world, centerBall);

  // =========================
  // CHARACTER IMAGE
  // =========================

  const character = Bodies.rectangle(
    window.innerWidth / 2 + 480,
    window.innerHeight / 2 - 20,
    120,
    120,
    {
      isStatic: true,

      angle: -0.15,

      render: {
        sprite: {
          texture: "character.png",
          xScale: 0.6,
          yScale: 0.6
        }
      }
    }
  );

  World.add(world, character);

  // =========================
  // AIRPLANE IMAGE
  // =========================

  const airplane = Bodies.rectangle(
    -300, // starts offscreen left
    180,
    300,
    150,
    {
      isStatic: true,

      render: {
        sprite: {
          texture: "airplane.png",
          xScale: 0.7,
          yScale: 0.7
        }
      }
    }
  );

  World.add(world, airplane);

  // =========================
  // SCROLL ANIMATION
  // =========================

  window.addEventListener("scroll", () => {

    const scrollY = window.scrollY;

    // airplane movement
    const airplaneX = -300 + scrollY * 1.5;

    Body.setPosition(airplane, {
      x: airplaneX,
      y: 180
    });
  });

  // =========================
  // CENTER CONSTRAINT
  // =========================

  const centerConstraint = Constraint.create({

    pointA: {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2
    },

    bodyB: centerBall,

    stiffness: 0.0015,
    damping: 0.15,

    render: {
      visible: false
    }
  });

  World.add(world, centerConstraint);

  // KEEP CENTER IMAGE CENTERED
  Events.on(engine, "beforeUpdate", () => {

    const targetX = window.innerWidth / 2;
    const targetY = window.innerHeight / 2;

    const forceX = (targetX - centerBall.position.x) * 0.00003;
    const forceY = (targetY - centerBall.position.y) * 0.00003;

    Body.applyForce(centerBall, centerBall.position, {
      x: forceX,
      y: forceY
    });
  });

  // MOUSE INTERACTION
  const mouse = Mouse.create(render.canvas);

  const mouseConstraint = MouseConstraint.create(engine, {

    mouse: mouse,

    constraint: {
      stiffness: 0.2,

      render: {
        visible: false
      }
    }
  });

  World.add(world, mouseConstraint);

  render.mouse = mouse;

  // RESIZE
  window.addEventListener("resize", () => {
    location.reload();
  });

</script>
