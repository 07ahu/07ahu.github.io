<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alayna Hu — Portfolio (mockup)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/portfolio.css">
  </head>
  <body>

    <header class="hero">
      <div class="hero-inner">
        <img src="name.png" alt="Alayna Hu" class="hero-logo">
        <p class="hero-sub">student @ duke university, creative, product designer</p>
      </div>
      <img src="character.png" alt="character" class="hero-character">
      <img src="airplane.png" alt="airplane" class="hero-airplane">
    </header>

    <main>
      <section class="projects">
        <div class="projects-inner">
          <div class="projects-left">
            <h3 class="section-label">PROJECTS</h3>
            <h2 class="project-title">DUKE<br>DORM<br>ENERGY<br>RANKING</h2>
            <p class="project-desc">Team project increasing transparency in dorm energy data + motivating students to improve; design + UI lead.</p>
          </div>
          <div class="projects-right">
            <div class="laptop-art">
              <!-- Use an available image as a placeholder for the laptop artwork -->
              <img src="7.png" alt="project artwork" onerror="this.style.opacity=0.6; this.src='3.png'">
            </div>
            <a class="view-project" href="#">VIEW PROJECT</a>
          </div>
        </div>
      </section>

      <section class="block-section">
        <div class="block-inner">
          <h2 class="block-title">BLOCK</h2>
          <div class="block-art">
            <!-- decorative cats / artwork -> reuse available images -->
            <img src="13.png" alt="cat sketch" />
          </div>
        </div>
      </section>
    </main>

    <footer class="page-footer">
      <p>Built from a Figma mockup — static HTML/CSS approximation</p>
    </footer>

  </body>
</html>
