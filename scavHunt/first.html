<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Begin the Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overscroll-behavior:none;
    background:#1b1108; /* matches the theme so any letterboxing isn't white */
    -webkit-text-size-adjust:100%;
  }
  .screen{
    position:relative;
    width:100%;
    height:100vh;       /* fallback for browsers without dvh support */
    height:100dvh;       /* accounts for mobile browser UI (address bar, etc.) */
    overflow:hidden;
  }
  .screen .bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;       /* fills the whole screen, cropping as needed */
    z-index:0;
    -webkit-touch-callout:none;
    user-select:none;
  }
  .screen .featured{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:90%;
    height:80%;
    max-height:80vh;
    object-fit:contain;     /* shown in full, never cropped */
    z-index:1;
    -webkit-touch-callout:none;
    user-select:none;
  }
  .go-btn{
    position:absolute;
    z-index:2;
    left:50%;
    bottom:calc(clamp(20px,5vh,48px) + env(safe-area-inset-bottom, 0px));
    transform:translateX(-50%);
    padding:0.7em 1.6em;
    min-height:44px;        /* comfortable tap target on touch devices */
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-family:'IM Fell English', Georgia, 'Times New Roman', serif;
    font-size:clamp(17px,2.6vw,24px);
    letter-spacing:0.02em;
    color:#5a2a14;
    background:#f3da8e;
    border:1px solid #5a2a14;
    border-radius:6px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    transition:background 0.2s ease, transform 0.15s ease;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent; /* remove gray flash on tap (Android/iOS) */
    touch-action:manipulation; /* avoid double-tap-to-zoom delay */
  }
  .go-btn:hover{
    background:#c9972f;
  }
  .go-btn:active{
    transform:translateX(-50%) scale(0.97);
    background:#c9972f;
  }

  /* Small phones in landscape (short viewport): pull the button up a bit
     and shrink padding so it doesn't crowd the bottom edge */
  @media (max-height:420px){
    .go-btn{
      bottom:calc(10px + env(safe-area-inset-bottom, 0px));
      padding:0.5em 1.2em;
      font-size:clamp(14px,2.2vw,18px);
    }
  }
</style>
</head>
<body>
<div class="screen">
  <img class="bg" src="background.png" alt="">
  <img class="featured" src="firstIMG.jpg" alt="">
  <a class="go-btn" href="https://dukeuniv.hub.arcgis.com/pages/scavhunt2~c3a39142be5f4e19b45f3198be153b0a">Begin the Hunt ⚓</a>
</div>
</body>
</html>
