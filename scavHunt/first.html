<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Begin the Hunt</title>
<style>
  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
  }

  .screen{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
  }

  .screen img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }

  .go-btn{
    position:absolute;
    bottom:clamp(20px,5vh,48px);
    left:50%;
    transform:translateX(-50%);
    padding:0.7em 1.6em;
    font-family:Georgia, 'Times New Roman', serif;
    font-size:clamp(16px,2.4vw,22px);
    color:#5a2a14;
    background:#f3da8e;
    border:1px solid #5a2a14;
    border-radius:6px;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    transition:background 0.2s ease, transform 0.15s ease;
    white-space:nowrap;
  }

  .go-btn:hover{
    background:#c9972f;
  }

  .go-btn:active{
    transform:translateX(-50%) scale(0.97);
  }
</style>
</head>
<body>

<div class="screen">
  <img src="1.jpg" alt="">
  <a class="go-btn" href="https://dukeuniv.hub.arcgis.com/pages/scavhunt2~c3a39142be5f4e19b45f3198be153b0a">Begin the Hunt ⚓</a>
</div>

</body>
</html>
